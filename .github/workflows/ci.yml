name: CI — Cours Python

# Vérifie, à chaque push / PR :
#   • que tout le Python du cours compile (pas d'erreur de syntaxe) ;
#   • que les corrigés (solutions.py) tournent ET affichent un score PLEIN ;
#   • que le contenu est cohérent (content.json à jour, exercices ↔ solutions,
#     liens internes) — via webapp/validate_content.py ;
#   • que la plateforme e-learning se charge et navigue sans erreur JS
#     (test de fumée Playwright, job « webapp »).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances (pandas, requests, ...)
        run: pip install -r requirements.txt

      # 1) Compiler tous les .py : détecte les erreurs de syntaxe
      - name: Compiler tout le Python
        run: python -m py_compile $(find . -name '*.py')

      # 2) Corrigés : ils doivent tourner ET afficher « N/N réussis »
      - name: Vérifier les corrigés (solutions.py) — score plein
        run: python webapp/check_solutions.py

      # 3) Cohérence du contenu (structure, exercices/solutions, liens, fraîcheur)
      - name: Valider le contenu et content.json
        run: python webapp/validate_content.py

  webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer Playwright + Chromium
        working-directory: webapp/tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Test de fumée de la plateforme
        working-directory: webapp/tests
        run: node smoke.mjs
